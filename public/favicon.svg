<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="qGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="qCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#d8b4fe" />
      <stop offset="85%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Relativistic Jets -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="url(#qGlow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 3" opacity="0.65" />
  <line x1="50" y1="20" x2="50" y2="80" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Outer Orbital/Accretion Disk (Tilted) -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="url(#qGlow)" stroke-width="2.5" transform="rotate(-25 50 50)" filter="url(#softGlow)" />
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#e0e7ff" stroke-width="1" stroke-dasharray="14 10" transform="rotate(-25 50 50)" opacity="0.9" />

  <!-- Inner Accretion Ring -->
  <ellipse cx="50" cy="50" rx="22" ry="8" fill="none" stroke="#a855f7" stroke-width="2" transform="rotate(-25 50 50)" />

  <!-- Central Supermassive Energy Core -->
  <circle cx="50" cy="50" r="10" fill="url(#qCore)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>
